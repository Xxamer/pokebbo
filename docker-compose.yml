version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pokebbo_dev
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    command: sh -c "mix deps.get && mix ecto.create && mix ecto.migrate && mix phx.server"
    environment:
      MIX_ENV: dev
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pokebbo_dev
      PORT: '4000'
    ports:
      - '4000:4000'
    depends_on:
      - db
    volumes:
      - .:/app
      - deps:/app/deps
      - _build:/app/_build
      - /app/node_modules
    working_dir: /app

volumes:
  db_data:
  deps:
  _build:
